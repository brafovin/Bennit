<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Zombie Shooter</title>
<style>
  html,body{margin:0;height:100%;background:#05060d;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:none;user-select:none}
  canvas{display:block;width:100%;height:100%}
  #shopBtn{position:fixed;top:10px;right:10px;width:54px;height:54px;border-radius:12px;border:2px solid #facc15;background:#1e293bcc;font-size:28px;cursor:pointer;display:none}
  #shop{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center}
  #panel{background:#111827;border:2px solid #facc15;border-radius:14px;padding:16px;width:min(560px,94vw);max-height:90vh;overflow:auto}
  #panel h2{margin:0 0 4px;display:flex;justify-content:space-between}
  .item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1f2937;border-radius:10px;padding:10px;margin-top:8px}
  .item small{color:#9ca3af;display:block}
  button.buy{background:#16a34a;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;min-width:90px}
  button.buy:disabled{background:#4b5563;cursor:not-allowed}
  button.buy.eq{background:#2563eb}
  #close{background:#dc2626;color:#fff;border:0;border-radius:8px;padding:4px 10px;cursor:pointer;font-weight:700}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="shopBtn" title="Shop (B)">🛒</button>
<div id="shop"><div id="panel">
  <h2><span>🛒 Shop</span><span id="cashTxt"></span><button id="close">X</button></h2>
  <div id="items"></div>
</div></div>

<script>
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

/* ---------- Config ---------- */
const WEAPONS = [
  {id:'glock',  name:'Glock',      cost:0,    dmg:50, cd:1.0,  desc:'50 dmg / 1s'},
  {id:'rifle',  name:'Rifle',      cost:100,  dmg:33, cd:0.5,  desc:'33 dmg / 0.5s'},
  {id:'mg',     name:'Machine Gun',cost:500,  dmg:20, cd:0.25, desc:'20 dmg / 0.25s'},
  {id:'shotgun',name:'Shotgun',    cost:1500, dmg:20, cd:1.0,  pellets:9, spread:0.4, range:380, desc:'9 pellets, 20 dmg close → 10 far / 1s'},
  {id:'minigun',name:'Minigun',    cost:3000, dmg:15, cd:0.05, desc:'15 dmg / 0.05s, overheats after ~4s (3s lockout)'},
];
const MINI_HEAT_TIME = 4, MINI_LOCK = 3;
// tier, firstWave, hp, cash, speed(px/s), color, radius
const ZTYPES = [
  {name:'Walker',  wave:1,  hp:100,    cash:10,   spd:55,  col:'#4ade80', r:14},
  {name:'Runner',  wave:5,  hp:250,    cash:25,   spd:68,  col:'#a3e635', r:15},
  {name:'Brute',   wave:10, hp:500,    cash:50,   spd:80,  col:'#facc15', r:17},
  {name:'Mauler',  wave:15, hp:1000,   cash:100,  spd:92,  col:'#fb923c', r:19},
  {name:'Fiend',   wave:25, hp:2500,   cash:250,  spd:104, col:'#f87171', r:21},
  {name:'Horror',  wave:35, hp:5000,   cash:500,  spd:116, col:'#c084fc', r:24},
  {name:'Titan',   wave:50, hp:10000,  cash:1000, spd:128, col:'#38bdf8', r:28},
];
const BOSS = {name:'BOSS', wave:99, hp:100000, cash:10000, spd:95, col:'#7f1d1d', r:60, tier:7};
const BASE_DMG = 10, DMG_GROWTH = 1.15;
const WALK = 170, SPRINT = 270;
const MAP = {w:1600, h:1100};

/* ---------- State ---------- */
const S = {
  mode:'lobby', // lobby | game
  cash:0, hp:100, maxHp:100, hpBuys:0,
  owned:{glock:true}, weapon:'glock',
  wave:0, toSpawn:0, spawnT:0, breakT:0,
  zombies:[], bullets:[], parts:[], floaters:[],
  shopOpen:false, fireCd:0, heat:0, lock:0,
  hurtCd:0, msg:'', msgT:0,
};
const P = {x:0,y:0,r:13,ang:0};
let bricks = [];
const keys = {}; let mouse = {x:0,y:0,down:false};
let joy = null; // touch joystick
let cam = {x:0,y:0};

/* ---------- Lobby ---------- */
const LOBBY = {plat:{x:-160,y:-60,w:320,h:200}, play:{x:260,y:10,w:160,h:80}};
function enterLobby(){
  S.mode='lobby'; S.zombies=[]; S.bullets=[]; S.parts=[]; S.floaters=[];
  P.x=-60; P.y=40; document.getElementById('shopBtn').style.display='none';
  closeShop();
}
function startGame(){
  S.mode='game';
  S.cash=0; S.hp=S.maxHp=100; S.hpBuys=0; S.owned={glock:true}; S.weapon='glock';
  S.wave=0; S.breakT=2; S.toSpawn=0; S.heat=0; S.lock=0;
  genMap(); P.x=MAP.w/2; P.y=MAP.h/2;
  document.getElementById('shopBtn').style.display='block';
  say('Get ready!',2);
}
function genMap(){
  bricks=[];
  let tries=0;
  while(bricks.length<22 && tries++<500){
    const w=50+Math.random()*110, h=40+Math.random()*90;
    const x=80+Math.random()*(MAP.w-160-w), y=80+Math.random()*(MAP.h-160-h);
    if(Math.hypot(x+w/2-MAP.w/2,y+h/2-MAP.h/2)<170) continue;
    if(bricks.some(b=>x<b.x+b.w+40&&x+w+40>b.x&&y<b.y+b.h+40&&y+h+40>b.y)) continue;
    bricks.push({x,y,w,h});
  }
}

/* ---------- Helpers ---------- */
function say(t,s=2){S.msg=t;S.msgT=s;}
const wpn=()=>WEAPONS.find(w=>w.id===S.weapon);
const hpCost=()=>Math.round(100*Math.pow(1.05,S.hpBuys));
function collideRect(o,r,rects){
  for(const b of rects){
    const cx=Math.max(b.x,Math.min(o.x,b.x+b.w)), cy=Math.max(b.y,Math.min(o.y,b.y+b.h));
    let dx=o.x-cx, dy=o.y-cy, d=Math.hypot(dx,dy);
    if(d<r){
      if(d===0){ o.y=b.y-r; continue; }
      o.x=cx+dx/d*r; o.y=cy+dy/d*r;
    }
  }
}
function segHitsRect(x1,y1,x2,y2,b){
  // slab test
  let t0=0,t1=1; const dx=x2-x1,dy=y2-y1;
  for(const [p,q] of [[-dx,x1-b.x],[dx,b.x+b.w-x1],[-dy,y1-b.y],[dy,b.y+b.h-y1]]){
    if(p===0){ if(q<0) return false; }
    else { const r=q/p; if(p<0){ if(r>t1) return false; if(r>t0) t0=r; } else { if(r<t0) return false; if(r<t1) t1=r; } }
  }
  return true;
}

/* ---------- Waves ---------- */
function startWave(){
  S.wave++; S.toSpawn=2*S.wave-1; S.spawnT=0;
  say('Wave '+S.wave,2.5);
}
function pickType(){
  const un=ZTYPES.filter(z=>z.wave<=S.wave);
  // weight toward newer types
  const ws=un.map((z,i)=>1+i*1.5); let tot=ws.reduce((a,b)=>a+b,0), r=Math.random()*tot;
  for(let i=0;i<un.length;i++){ r-=ws[i]; if(r<=0) return {...un[i],tier:ZTYPES.indexOf(un[i])}; }
  return {...un[0],tier:0};
}
function spawnZombie(boss){
  const t=boss?{...BOSS}:pickType();
  const side=Math.floor(Math.random()*4); let x,y;
  if(side===0){x=Math.random()*MAP.w;y=-20;} else if(side===1){x=Math.random()*MAP.w;y=MAP.h+20;}
  else if(side===2){x=-20;y=Math.random()*MAP.h;} else {x=MAP.w+20;y=Math.random()*MAP.h;}
  S.zombies.push({x,y,hp:t.hp,max:t.hp,cash:t.cash,spd:t.spd*(0.92+Math.random()*0.16),col:t.col,r:t.r,
    dmg:BASE_DMG*Math.pow(DMG_GROWTH,t.tier),boss:!!boss,atk:0,name:t.name,
    free:true});
}

/* ---------- Shooting ---------- */
function bullet(ang,dmg,range,farDmg){
  S.bullets.push({x:P.x,y:P.y,vx:Math.cos(ang)*900,vy:Math.sin(ang)*900,dmg,farDmg:farDmg??dmg,range:range||1200,d:0});
}
function fire(){
  const w=wpn();
  if(w.id==='minigun' && S.lock>0) return;
  if(S.fireCd>0) return;
  S.fireCd=w.cd;
  const a=P.ang;
  if(w.pellets){
    for(let i=0;i<w.pellets;i++) bullet(a+(Math.random()-.5)*w.spread,20,w.range,10);
  } else {
    const j=w.id==='minigun'?(Math.random()-.5)*0.08:0;
    bullet(a+j,w.dmg,1200);
  }
  // muzzle flash
  for(let i=0;i<3;i++) S.parts.push({x:P.x+Math.cos(a)*22,y:P.y+Math.sin(a)*22,vx:Math.cos(a)*80+(Math.random()-.5)*60,vy:Math.sin(a)*80+(Math.random()-.5)*60,life:.12,max:.12,col:'#fde047',s:3});
}

/* ---------- Update ---------- */
function update(dt){
  if(S.msgT>0) S.msgT-=dt;
  if(S.mode==='lobby') return updateLobby(dt);
  if(S.shopOpen) return;

  // movement
  let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  let my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(joy){ mx=joy.dx; my=joy.dy; }
  const l=Math.hypot(mx,my); if(l>1){mx/=l;my/=l;}
  const sprint=keys.shift||(joy&&joy.len>0.95);
  const sp=sprint?SPRINT:WALK;
  P.x+=mx*sp*dt; P.y+=my*sp*dt;
  P.x=Math.max(P.r,Math.min(MAP.w-P.r,P.x)); P.y=Math.max(P.r,Math.min(MAP.h-P.r,P.y));
  collideRect(P,P.r,bricks);

  // aim
  P.ang=Math.atan2(mouse.y+cam.y-P.y,mouse.x+cam.x-P.x);
  S.fireCd-=dt;
  const w=wpn();
  if(S.lock>0){ S.lock-=dt; if(S.lock<=0){S.lock=0;S.heat=0;} }
  if(mouse.down && !(w.id==='minigun'&&S.lock>0)) fire();
  if(w.id==='minigun'){
    if(mouse.down && S.lock<=0 && S.fireCd>=0 && S.fireCd>w.cd-dt-1e-6) S.heat+=0; // heat handled below
    if(mouse.down && S.lock<=0){ S.heat+=dt/MINI_HEAT_TIME; if(S.heat>=1){S.heat=1;S.lock=MINI_LOCK;say('OVERHEATED!',1.5);} }
    else if(S.lock<=0) S.heat=Math.max(0,S.heat-dt/2.5);
  } else S.heat=0;
  // smoke while locked
  if(w.id==='minigun' && S.lock>0 && Math.random()<dt*40){
    S.parts.push({x:P.x+Math.cos(P.ang)*24+(Math.random()-.5)*6,y:P.y+Math.sin(P.ang)*24,vx:(Math.random()-.5)*20,vy:-30-Math.random()*30,life:1.1,max:1.1,col:'#9ca3af',s:5+Math.random()*5,smoke:true});
  }

  // bullets
  for(const b of S.bullets){
    const nx=b.x+b.vx*dt, ny=b.y+b.vy*dt;
    b.d+=Math.hypot(b.vx,b.vy)*dt;
    if(bricks.some(r=>segHitsRect(b.x,b.y,nx,ny,r))){ b.dead=true; continue; }
    for(const z of S.zombies){
      if(z.hp<=0) continue;
      // segment-circle
      const sx=nx-b.x, sy=ny-b.y, fx=b.x-z.x, fy=b.y-z.y;
      const A=sx*sx+sy*sy, B=2*(fx*sx+fy*sy), C=fx*fx+fy*fy-z.r*z.r;
      const disc=B*B-4*A*C;
      if(disc>=0){ const t=(-B-Math.sqrt(disc))/(2*A); if(t<=1 && (t>=0||C<0)){
        let dmg=b.dmg; if(b.farDmg!==b.dmg) dmg=b.dmg+(b.farDmg-b.dmg)*Math.min(1,b.d/b.range);
        dmg=Math.round(dmg);
        z.hp-=dmg; b.dead=true;
        S.floaters.push({x:z.x,y:z.y-z.r,t:.6,txt:dmg});
        for(let i=0;i<4;i++) S.parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,life:.3,max:.3,col:'#991b1b',s:3});
        if(z.hp<=0){ S.cash+=z.cash; S.floaters.push({x:z.x,y:z.y-z.r-14,t:.9,txt:'+$'+z.cash,col:'#facc15'}); }
        break;
      }}
    }
    b.x=nx; b.y=ny;
    if(b.d>b.range && b.range<1200) b.dead=true;
    if(b.d>1400||b.x<-50||b.y<-50||b.x>MAP.w+50||b.y>MAP.h+50) b.dead=true;
  }
  S.bullets=S.bullets.filter(b=>!b.dead);
  S.zombies=S.zombies.filter(z=>z.hp>0);

  // zombies
  S.hurtCd-=dt;
  for(const z of S.zombies){
    const dx=P.x-z.x, dy=P.y-z.y, d=Math.hypot(dx,dy)||1;
    z.x+=dx/d*z.spd*dt; z.y+=dy/d*z.spd*dt;
    // separation
    for(const o of S.zombies) if(o!==z){ const ox=z.x-o.x, oy=z.y-o.y, od=Math.hypot(ox,oy), m=z.r+o.r;
      if(od>0&&od<m){ const p=(m-od)*.5*dt*8; z.x+=ox/od*p; z.y+=oy/od*p; } }
    collideRect(z,z.r,bricks);
    z.atk-=dt;
    if(d<z.r+P.r+4 && z.atk<=0){
      z.atk=1; S.hp-=Math.round(z.dmg);
      S.floaters.push({x:P.x,y:P.y-18,t:.6,txt:'-'+Math.round(z.dmg),col:'#f87171'});
      if(S.hp<=0){ say('You died! Back to the void…',3); enterLobby(); return; }
    }
  }

  // waves
  if(S.toSpawn>0){
    S.spawnT-=dt;
    if(S.spawnT<=0){
      if(S.wave===99 && !S.bossSpawned){ spawnZombie(true); S.bossSpawned=true; }
      else spawnZombie(false);
      S.toSpawn--; S.spawnT=Math.max(.25,1.2-S.wave*.02);
    }
  } else if(S.zombies.length===0){
    if(S.breakT<=0){
      if(S.wave>0){ S.hp=Math.min(S.maxHp,S.hp+Math.ceil(S.maxHp*.2)); }
      S.breakT=3.5;
    } else {
      S.breakT-=dt;
      if(S.breakT<=0){ S.bossSpawned=false; startWave(); S.breakT=0; S.waveStarted=true; }
    }
  }

  // fx
  for(const p of S.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
  S.parts=S.parts.filter(p=>p.life>0);
  for(const f of S.floaters){ f.y-=30*dt; f.t-=dt; }
  S.floaters=S.floaters.filter(f=>f.t>0);

  cam.x=Math.max(0,Math.min(MAP.w-W,P.x-W/2)); cam.y=Math.max(0,Math.min(MAP.h-H,P.y-H/2));
  if(MAP.w<W) cam.x=(MAP.w-W)/2; if(MAP.h<H) cam.y=(MAP.h-H)/2;
}
function updateLobby(dt){
  let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  let my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(joy){ mx=joy.dx; my=joy.dy; }
  const l=Math.hypot(mx,my); if(l>1){mx/=l;my/=l;}
  const sp=keys.shift?SPRINT:WALK;
  let nx=P.x+mx*sp*dt, ny=P.y+my*sp*dt;
  const inRect=(r,x,y)=>x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h;
  const walkable=(x,y)=>inRect(LOBBY.plat,x,y)||inRect(LOBBY.play,x,y)||(x>=LOBBY.plat.x+LOBBY.plat.w-2&&x<=LOBBY.play.x+2&&y>35&&y<65);
  if(walkable(nx,P.y)) P.x=nx; if(walkable(P.x,ny)) P.y=ny;
  if(inRect(LOBBY.play,P.x,P.y)) startGame();
  cam.x=P.x-W/2; cam.y=P.y-H/2;
}

/* ---------- Render ---------- */
function drawLobby(t){
  ctx.fillStyle='#05060d'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(let i=0;i<90;i++){ const x=((i*7919)%1000)/1000*W, y=((i*104729)%1000)/1000*H; ctx.globalAlpha=.3+.4*Math.sin(t*2+i); ctx.fillRect(x,y,2,2); }
  ctx.globalAlpha=1;
  ctx.save(); ctx.translate(-cam.x,-cam.y);
  const p=LOBBY.plat, g=LOBBY.play;
  ctx.fillStyle='#1f2937'; ctx.fillRect(p.x,p.y,p.w,p.h); ctx.strokeStyle='#6b7280'; ctx.lineWidth=4; ctx.strokeRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle='#374151'; ctx.fillRect(p.x+p.w,38,g.x-p.x-p.w,24); // bridge
  ctx.fillStyle='#16a34a'; ctx.fillRect(g.x,g.y,g.w,g.h);
  ctx.shadowColor='#22c55e'; ctx.shadowBlur=20+8*Math.sin(t*4); ctx.strokeStyle='#4ade80'; ctx.strokeRect(g.x,g.y,g.w,g.h); ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.font='bold 34px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('PLAY',g.x+g.w/2,g.y+g.h/2);
  drawPlayer(0);
  ctx.restore();
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='20px system-ui';
  ctx.fillText('WASD / arrows to move · Shift to sprint · Walk onto the green PLAY platform',W/2,40);
  if(S.msgT>0){ ctx.fillStyle='#f87171'; ctx.font='bold 26px system-ui'; ctx.fillText(S.msg,W/2,80); }
}
function drawPlayer(){
  ctx.save(); ctx.translate(P.x,P.y); ctx.rotate(P.ang||0);
  ctx.fillStyle='#374151'; ctx.fillRect(8,-4,18,8); // gun
  ctx.fillStyle='#60a5fa'; ctx.beginPath(); ctx.arc(0,0,P.r,0,7); ctx.fill();
  ctx.strokeStyle='#1e3a8a'; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
}
function drawGame(t){
  ctx.fillStyle='#0b0f14'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(-cam.x,-cam.y);
  ctx.fillStyle='#1c2a1f'; ctx.fillRect(0,0,MAP.w,MAP.h);
  ctx.strokeStyle='#ffffff10'; ctx.lineWidth=1;
  for(let x=0;x<=MAP.w;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,MAP.h);ctx.stroke();}
  for(let y=0;y<=MAP.h;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(MAP.w,y);ctx.stroke();}
  ctx.strokeStyle='#facc15'; ctx.lineWidth=4; ctx.strokeRect(0,0,MAP.w,MAP.h);
  for(const b of bricks){
    ctx.fillStyle='#9a3412'; ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle='#7c2d12'; ctx.lineWidth=2;
    for(let y=b.y;y<b.y+b.h;y+=20){ ctx.beginPath(); ctx.moveTo(b.x,y); ctx.lineTo(b.x+b.w,y); ctx.stroke();
      const off=((y-b.y)/20%2)*20; for(let x=b.x+off+20;x<b.x+b.w;x+=40){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,Math.min(y+20,b.y+b.h)); ctx.stroke(); } }
    ctx.strokeStyle='#431407'; ctx.strokeRect(b.x,b.y,b.w,b.h);
  }
  for(const z of S.zombies){
    ctx.fillStyle=z.col; ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,7); ctx.fill();
    ctx.strokeStyle='#0008'; ctx.lineWidth=2; ctx.stroke();
    const a=Math.atan2(P.y-z.y,P.x-z.x);
    ctx.fillStyle=z.col; ctx.fillRect(z.x+Math.cos(a)*z.r*.7-4+Math.cos(a+1.4)*z.r*.8,z.y+Math.sin(a)*z.r*.7-4+Math.sin(a+1.4)*z.r*.8,8,8);
    ctx.fillRect(z.x+Math.cos(a)*z.r*.7-4+Math.cos(a-1.4)*z.r*.8,z.y+Math.sin(a)*z.r*.7-4+Math.sin(a-1.4)*z.r*.8,8,8);
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(z.x+Math.cos(a-.4)*z.r*.5,z.y+Math.sin(a-.4)*z.r*.5,2.5,0,7); ctx.arc(z.x+Math.cos(a+.4)*z.r*.5,z.y+Math.sin(a+.4)*z.r*.5,2.5,0,7); ctx.fill();
    // hp bar
    const bw=z.r*2; ctx.fillStyle='#000a'; ctx.fillRect(z.x-bw/2,z.y-z.r-10,bw,5);
    ctx.fillStyle=z.boss?'#ef4444':'#22c55e'; ctx.fillRect(z.x-bw/2,z.y-z.r-10,bw*Math.max(0,z.hp/z.max),5);
  }
  drawPlayer();
  ctx.fillStyle='#fde047';
  for(const b of S.bullets){ ctx.beginPath(); ctx.arc(b.x,b.y,3,0,7); ctx.fill(); }
  for(const p of S.parts){ ctx.globalAlpha=Math.max(0,p.life/p.max)*(p.smoke?.6:1); ctx.fillStyle=p.col; const s=p.smoke?p.s*(1+(1-p.life/p.max)):p.s; ctx.beginPath(); ctx.arc(p.x,p.y,s,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  ctx.font='bold 14px system-ui'; ctx.textAlign='center';
  for(const f of S.floaters){ ctx.globalAlpha=Math.min(1,f.t*2); ctx.fillStyle=f.col||'#fff'; ctx.fillText(f.txt,f.x,f.y); }
  ctx.globalAlpha=1;
  ctx.restore();

  // HUD
  ctx.textAlign='left'; ctx.font='bold 18px system-ui';
  const bw=220; ctx.fillStyle='#000a'; ctx.fillRect(12,12,bw,22);
  ctx.fillStyle='#ef4444'; ctx.fillRect(12,12,bw*Math.max(0,S.hp/S.maxHp),22);
  ctx.fillStyle='#fff'; ctx.fillText(`${Math.max(0,Math.ceil(S.hp))} / ${S.maxHp}`,18,29);
  ctx.fillStyle='#facc15'; ctx.fillText('$ '+S.cash,12,56);
  ctx.fillStyle='#fff'; ctx.fillText(`Wave ${S.wave}  ·  Zombies: ${S.zombies.length+S.toSpawn}`,12,80);
  ctx.fillText(wpn().name,12,104);
  const w=wpn();
  if(w.id==='minigun'){
    ctx.fillStyle='#000a'; ctx.fillRect(12,112,160,10);
    ctx.fillStyle=S.lock>0?'#6b7280':`hsl(${60-60*S.heat},100%,50%)`; ctx.fillRect(12,112,160*(S.lock>0?1-S.lock/MINI_LOCK:S.heat),10);
    if(S.lock>0){ctx.fillStyle='#f87171';ctx.font='14px system-ui';ctx.fillText('OVERCHARGED – cooling '+S.lock.toFixed(1)+'s',12,140);}
  }
  ctx.textAlign='center';
  if(S.msgT>0){ ctx.font='bold 40px system-ui'; ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=5; ctx.strokeText(S.msg,W/2,90); ctx.fillText(S.msg,W/2,90); }
  else if(S.toSpawn===0&&S.zombies.length===0&&S.breakT>0){ ctx.font='bold 24px system-ui'; ctx.fillStyle='#fff'; ctx.fillText('Next wave in '+Math.ceil(S.breakT)+'…  (B = shop)',W/2,60); }
  ctx.font='13px system-ui'; ctx.fillStyle='#fff8'; ctx.fillText('WASD move · Shift sprint · Click/hold to shoot · B shop',W/2,H-12);
  if(joy){ ctx.globalAlpha=.3; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(joy.ox,joy.oy,50,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(joy.ox+joy.dx*40,joy.oy+joy.dy*40,22,0,7); ctx.fill(); ctx.globalAlpha=1; }
}

/* ---------- Shop ---------- */
function openShop(){ if(S.mode!=='game') return; S.shopOpen=true; mouse.down=false; document.getElementById('shop').style.display='flex'; renderShop(); }
function closeShop(){ S.shopOpen=false; document.getElementById('shop').style.display='none'; }
function renderShop(){
  document.getElementById('cashTxt').textContent='$ '+S.cash;
  const el=document.getElementById('items'); el.innerHTML='';
  for(const w of WEAPONS){
    const owned=S.owned[w.id], eq=S.weapon===w.id;
    const d=document.createElement('div'); d.className='item';
    d.innerHTML=`<div><b>${w.name}</b><small>${w.desc}</small></div>`;
    const b=document.createElement('button'); b.className='buy';
    if(eq){ b.textContent='Equipped'; b.disabled=true; }
    else if(owned){ b.textContent='Equip'; b.classList.add('eq'); b.onclick=()=>{S.weapon=w.id;S.heat=0;S.lock=0;renderShop();}; }
    else { b.textContent='$ '+w.cost; b.disabled=S.cash<w.cost; b.onclick=()=>{ if(S.cash>=w.cost){S.cash-=w.cost;S.owned[w.id]=true;S.weapon=w.id;S.heat=0;S.lock=0;renderShop();} }; }
    d.appendChild(b); el.appendChild(d);
  }
  const d=document.createElement('div'); d.className='item';
  d.innerHTML=`<div><b>❤ Health +10</b><small>Max health: ${S.maxHp}</small></div>`;
  const b=document.createElement('button'); b.className='buy'; const c=hpCost();
  b.textContent='$ '+c; b.disabled=S.cash<c;
  b.onclick=()=>{ if(S.cash>=c){S.cash-=c;S.hpBuys++;S.maxHp+=10;S.hp+=10;renderShop();} };
  d.appendChild(b); el.appendChild(d);
}
document.getElementById('shopBtn').addEventListener('click',()=>S.shopOpen?closeShop():openShop());
document.getElementById('close').addEventListener('click',closeShop);

/* ---------- Input ---------- */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); keys[k]=true; if(e.shiftKey) keys.shift=true;
  if(k==='b'){ S.shopOpen?closeShop():openShop(); }
  if(k==='escape') closeShop();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; if(!e.shiftKey) keys.shift=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; mouse.down=false; });
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch' && e.clientX<W*.4){ joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0,len:0}; return; }
  mouse.x=e.clientX; mouse.y=e.clientY; mouse.down=true; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(joy&&e.pointerId===joy.id){ let dx=(e.clientX-joy.ox)/50, dy=(e.clientY-joy.oy)/50; const l=Math.hypot(dx,dy); joy.len=l; if(l>1){dx/=l;dy/=l;} joy.dx=dx; joy.dy=dy; return; }
  mouse.x=e.clientX; mouse.y=e.clientY;
});
const up=e=>{ if(joy&&e.pointerId===joy.id){ joy=null; return; } mouse.down=false; };
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);

/* ---------- Loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  update(dt);
  if(S.mode==='lobby') drawLobby(now/1000); else drawGame(now/1000);
  requestAnimationFrame(loop);
}
enterLobby();
requestAnimationFrame(loop);
window.__S=S; window.__P=P; // debug hooks
</script>
